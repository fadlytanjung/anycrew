name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python and Node CLIs generate identical projects
        run: uv run --no-project python tests/test_parity.py
      - name: Interactive init asks and honours the answers (both CLIs)
        run: uv run --no-project python tests/test_interactive.py
      - name: Build the wheel and run it
        run: |
          uv build
          uvx --from dist/anycrew-*.whl anycrew --version
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code plugin and marketplace manifests validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Generated Claude plugin is fresh
        run: node scripts/build-claude.mjs && git diff --exit-code -- plugins/claude
