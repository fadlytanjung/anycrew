name: wiki
# Publishes wiki/ to the repository's GitHub wiki.
# One-time setup: enable the wiki in Settings → Features and create any first page in the Wiki tab
# (GitHub only creates the wiki git repository after that), then run this workflow once from the
# Actions tab. After that it runs on every push that touches wiki/.
on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite Page.md links to wiki page names
        run: |
          rm -rf /tmp/wiki && cp -r wiki /tmp/wiki
          sed -i -E 's/\]\(([A-Za-z_-]+)\.md\)/](\1)/g' /tmp/wiki/*.md
      - name: Publish to the GitHub wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: /tmp/wiki
